<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reitclub Lochau – Arena Booking</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing:border-box; }

body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f3;
  color:#26352c;
}

header {
  background:#244b36;
  color:white;
  padding:22px 16px;
}

header h1 {
  margin:0;
  font-size:23px;
}

header p {
  margin:7px 0 0;
  color:#d9e7dc;
}

main {
  max-width:1100px;
  margin:auto;
  padding:18px;
}

.card {
  background:white;
  padding:18px;
  border-radius:14px;
  margin-bottom:16px;
  box-shadow:0 2px 8px #0000000c;
}

input,select,button {
  padding:12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
  margin:4px 0;
}

input,select {
  width:100%;
}

button {
  cursor:pointer;
  background:#326d49;
  color:white;
  border:0;
  font-weight:bold;
}

button.secondary {
  background:#e8eee9;
  color:#244b36;
}

button.danger {
  background:#a94442;
}

.hidden { display:none; }

.controls {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  align-items:center;
}

.controls button {
  flex:1;
}

.calendar {
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:4px;
}

.dayname {
  text-align:center;
  font-weight:bold;
  padding:8px 0;
  font-size:12px;
}

.day {
  background:#f4f6f3;
  border-radius:7px;
  min-height:95px;
  padding:5px;
  font-size:12px;
  overflow:hidden;
}

.day.today {
  border:2px solid #326d49;
}

.day.other {
  opacity:.4;
}

.day-number {
  font-weight:bold;
  margin-bottom:5px;
}

.booking-entry {
  background:#dcecdf;
  color:#244b36;
  border-radius:4px;
  padding:3px;
  margin-bottom:3px;
  font-size:10px;
  overflow-wrap:anywhere;
}

.week-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 2px;
  width: 100%;
}

.week-day {
  min-width: 0;
  background: #f4f6f3;
  padding: 3px;
  border-radius: 5px;
  font-size: 10px;
  overflow-wrap: anywhere;
}

.week-day .slot {
  font-size: 10px;
  padding: 2px;
}

/* Ampelfarben für den Belegungskalender */

.slot-free,
.booking-entry.slot-free {
  background-color: #d9f0df !important;
  color: #205b35 !important;
}

.slot-partial,
.booking-entry.slot-partial {
  background-color: #fff0b3 !important;
  color: #765600 !important;
}

.slot-full,
.booking-entry.slot-full {
  background-color: #f6caca !important;
  color: #8b2424 !important;
}
.slot {
  padding:8px 3px;
  margin:4px 0;
  border-radius:5px;
  background:#e3eee5;
  font-size:11px;
  cursor:pointer;
  text-align:center;
}

.slot.full {
  background:#f4dddd;
  cursor:not-allowed;
}

.slot.empty {
  background:#e3eee5;
}

table {
  width:100%;
  border-collapse:collapse;
}

td,th {
  border-bottom:1px solid #eee;
  padding:10px 5px;
  text-align:left;
  font-size:13px;
}

.status {
  padding:10px;
  border-radius:8px;
  background:#e8eee9;
  margin-bottom:12px;
}

@media(max-width:550px) {
  main {padding:10px;}
  .day {min-height:75px;}
  .dayname {font-size:10px;}
  .booking-entry {font-size:9px;}
}
</style>
</head>

<body>

<header>
  <h1>🐎 Reitclub Lochau</h1>
  <p>Arena Booking – Online-Belegungsplan</p>
</header>

<main>

<!-- LOGIN -->

<section id="login" class="card">
  <h2>Mitglieder-Login</h2>

  <input id="email" type="email"
         placeholder="E-Mail-Adresse">

  <input id="password" type="password"
         placeholder="Passwort">

  <button onclick="login()">Anmelden</button>

  <button class="secondary"
          onclick="register()">
    Neues Mitglied registrieren
  </button>

  <p id="loginMessage"></p>
</section>

<!-- APP -->

<section id="app" class="hidden">

  <div class="card">
    <div id="welcome"></div>
    <div id="memberStatus" class="status"></div>

    <button class="secondary"
            onclick="logout()">
      Abmelden
    </button>
  </div>

  <!-- KALENDER -->

  <div class="card hidden" id="calendarCard">

    <h2>Belegungskalender</h2>

    <select id="facility"
            onchange="loadBookings()">
      <option value="halle">Reithalle</option>
      <option value="gross">Großer Reitplatz</option>
      <option value="klein">Kleiner Reitplatz</option>
      <option value="longierzirkel">Longierzirkel</option>
    </select>

    <div class="controls">
      <button class="secondary"
              onclick="changeMonth(-1)">◀</button>

      <button class="secondary"
              onclick="goToday()">Heute</button>

      <button class="secondary"
              onclick="changeMonth(1)">▶</button>
    </div>

    <h3 id="monthLabel"></h3>

    <div class="controls">
      <button id="monthBtn"
              onclick="setView('month')">
        Monat
      </button>

      <button class="secondary"
              onclick="setView('week')">
        Woche
      </button>

      <button class="secondary"
              onclick="setView('day')">
        Tag
      </button>
    </div>

    <div id="calendar" style="margin-top:15px"></div>

  </div>

  <!-- BUCHUNG -->

  <div class="card hidden" id="bookingCard">

    <h2>Neue Buchung</h2>

    <label>Datum</label>
    <input type="date" id="bookingDate">

    <label>Uhrzeit</label>
    <select id="bookingHour"></select>

    <button onclick="makeBooking()">
      Platz buchen
    </button>

    <p id="bookingMessage"></p>

  </div>

  <!-- EIGENE BUCHUNGEN -->

  <div class="card hidden" id="myBookingsCard">
    <h2>Meine Buchungen</h2>
    <div id="myBookings"></div>
  </div>

  <!-- ADMIN -->

  <div class="card hidden" id="adminPanel">
  <h2>Administration</h2>
  <h3>Mitglieder verwalten</h3>
  <div id="membersList"></div>

  <h3>Alle Buchungen verwalten</h3>
  <div id="adminBookings"></div>
</div>
    
    
  



</section>

</main>

<script>

// SUPABASE VERBINDUNG

const SUPABASE_URL =
'https://euvwgvtanborprkrtrct.supabase.co';

const SUPABASE_KEY =
'sb_publishable_-NueqNFJb7kuCIaWjCo3Sw_SVugvyv_';

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let user = null;
let member = null;
let bookings = [];
let facilities = [];
let currentDate = new Date();
let view = 'month';

// ZEITEN

const hourSelect =
document.getElementById('bookingHour');

for(let h=7;h<=20;h++){
  let option=document.createElement('option');
  option.value=h;
  option.textContent=
    String(h).padStart(2,'0')+':00 Uhr';
  hourSelect.appendChild(option);
}

// LOGIN

async function login(){

  const email=
    document.getElementById('email').value;

  const password=
    document.getElementById('password').value;

  const {data,error}=
    await db.auth.signInWithPassword({
      email,password
    });

  if(error){
    showMessage(error.message);
    return;
  }

  await startApp(data.user);
}

// REGISTRIERUNG

async function register(){

  const email=
    document.getElementById('email').value;

  const password=
    document.getElementById('password').value;

  if(!email || !password){
    showMessage('Bitte E-Mail und Passwort eingeben.');
    return;
  }

  const {error}=await db.auth.signUp({
    email,password
  });

  if(error){
    showMessage(error.message);
  }else{
    showMessage(
      'Registrierung angelegt. Bitte E-Mail bestätigen. Danach muss dein Mitgliedskonto freigeschaltet werden.'
    );
  }
}

function showMessage(message){
  document.getElementById('loginMessage')
    .textContent=message;
}

// APP STARTEN

async function startApp(authUser){

  user=authUser;

  document.getElementById('login')
    .classList.add('hidden');

  document.getElementById('app')
    .classList.remove('hidden');

  const {data,error}=await db
    .from('members')
    .select('*')
    .eq('id',user.id)
    .single();

  if(error || !data){
    document.getElementById('memberStatus')
      .textContent=
      'Mitgliedskonto noch nicht eingerichtet. Bitte den Administrator kontaktieren.';
    return;
  }

  member=data;

  document.getElementById('welcome')
    .textContent='Willkommen, '+member.full_name;

  const active=member.active && member.approved;
document.getElementById('calendarCard').classList.toggle('hidden', !active);
  document.getElementById('memberStatus')
    .textContent=active
      ? 'Mitgliedskonto aktiv ✓'
      : 'Dein Zugang wartet auf Freischaltung.';
document.getElementById('bookingCard').classList.toggle('hidden', !active);
document.getElementById('myBookingsCard').classList.toggle('hidden', !active);
  if(member.role==='admin'){
    document.getElementById('adminPanel')
      .classList.remove('hidden');

    loadMembers();
    loadAdminBookings();
  }

  if(!active){
    document.getElementById('bookingCard')
      .classList.add('hidden');
  }

  await loadFacilities();
  await loadBookings();
  await loadMyBookings();
}

// FACILITIES

async function loadFacilities(){

  const {data,error}=await db
    .from('facilities')
    .select('*');

  if(error){
    console.error(error);
    return;
  }

  facilities=data || [];
}

// BUCHUNGEN LADEN

async function loadBookings(){

  if(!member) return;

  const facility=
    document.getElementById('facility').value;

  const start=new Date(
    currentDate.getFullYear(),
    currentDate.getMonth(),1
  );

  const end=new Date(
    currentDate.getFullYear(),
    currentDate.getMonth()+1,0
  );

  const format=d=>
    d.getFullYear()+'-'+
    String(d.getMonth()+1).padStart(2,'0')+'-'+
    String(d.getDate()).padStart(2,'0');

  const {data,error}=await db
  .from('booking_calendar')
  .select('id,facility_id,facility_name,booking_date,start_hour,member_name')
  .eq('facility_id',facility)
  .gte('booking_date',format(start))
  .lte('booking_date',format(end));
    
  
    
    
    

  if(error){
  alert('Kalenderfehler: ' + error.message);
  console.error(error);
  return;
}

  bookings=data || [];

  try {
  renderCalendar();
} catch (err) {
  alert('Anzeigefehler: ' + err.message);
  console.error(err);
}
}

// KALENDER

function renderCalendar(){

  const calendar=
    document.getElementById('calendar');

  calendar.innerHTML='';

document.getElementById('monthLabel')
  .textContent = currentDate.toLocaleDateString(
    'de-DE',
    { month: 'long', year: 'numeric' }
  );

  if(view==='month'){
    renderMonth(calendar);
  }

  if(view==='week'){
    renderWeek(calendar);
  }

  if(view==='day'){
    renderDay(calendar);
  }
}

// MONATSANSICHT

function renderMonth(calendar){

  calendar.className='calendar';

  ['Mo','Di','Mi','Do','Fr','Sa','So']
    .forEach(name=>{
      const el=document.createElement('div');
      el.className='dayname';
      el.textContent=name;
      calendar.appendChild(el);
    });

  const year=currentDate.getFullYear();
  const month=currentDate.getMonth();

  let first=new Date(year,month,1);
  let offset=(first.getDay()+6)%7;

  const days=new Date(year,month+1,0).getDate();

  for(let i=0;i<offset;i++){
    const empty=document.createElement('div');
    empty.className='day other';
    calendar.appendChild(empty);
  }

  for(let d=1;d<=days;d++){

    const date=new Date(year,month,d);

    const dateString=formatDate(date);

    const cell=document.createElement('div');
    cell.className='day';

    if(dateString===formatDate(new Date())){
      cell.classList.add('today');
    }

    cell.innerHTML=
      '<div class="day-number">'+d+'</div>';

    const dayBookings=bookings.filter(
      b=>b.booking_date===dateString
    );
const capacity = {
  halle: 2,
  gross: 4,
  klein: 2,
  longierzirkel: 1
}[document.getElementById('facility').value];

const hours = [...new Set(
  dayBookings.map(b => b.start_hour)
)].sort((a, b) => a - b);

hours.forEach(hour => {
  const count = dayBookings.filter(
    b => b.start_hour === hour
  ).length;

  const entry = document.createElement('div');
entry.className = 'booking-entry ' +
  (count >= capacity
    ? 'slot-full'
    : count > 0
      ? 'slot-partial'
      : 'slot-free');
entry.style.whiteSpace = 'pre-line';
  entry.textContent =
  String(hour).padStart(2, '0') + ' Uhr\n' +
  count + '/' + capacity;

  cell.appendChild(entry);
});
  

    cell.onclick=()=>{
      currentDate=date;
      setView('day');
    };

    calendar.appendChild(cell);
  }
}

// WOCHENANSICHT

function renderWeek(calendar){

  calendar.className='week-grid';

  const monday=new Date(currentDate);
  monday.setDate(
    monday.getDate()-
    ((monday.getDay()+6)%7)
  );

  for(let i=0;i<7;i++){

    const date=new Date(monday);
    date.setDate(monday.getDate()+i);

    const column=document.createElement('div');
    column.className='week-day';

    column.innerHTML=
      '<strong>'+
      date.toLocaleDateString('de-DE',{
        weekday:'short',day:'2-digit'
      })+
      '</strong>';

    const dayBookings=bookings.filter(
      b=>b.booking_date===formatDate(date)
    );

    const capacity = {
  halle: 2,
  gross: 4,
  klein: 2,
  longierzirkel: 1
}[document.getElementById('facility').value];

const hours = [...new Set(
  dayBookings.map(b => b.start_hour)
)].sort((a, b) => a - b);

hours.forEach(hour => {
  const count = dayBookings.filter(
    b => b.start_hour === hour
  ).length;

  const slot = document.createElement('div');
  slot.className = 'slot ' +
  (count >= capacity
    ? 'slot-full'
    : count > 0
      ? 'slot-partial'
      : 'slot-free');

  slot.style.whiteSpace = 'pre-line';

  slot.textContent =
    String(hour).padStart(2, '0') + ' Uhr\n' +
    count + '/' + capacity;

  column.appendChild(slot);
});

    column.onclick=()=>{
      currentDate=date;
      setView('day');
    };

    calendar.appendChild(column);
  }
}

// TAGESANSICHT

function renderDay(calendar){

  calendar.className='';

  const date=formatDate(currentDate);

  calendar.innerHTML=
    '<h3>'+
    currentDate.toLocaleDateString('de-DE',{
      weekday:'long',day:'2-digit',
      month:'long',year:'numeric'
    })+
    '</h3>';

  const facility=document.getElementById('facility').value;

  const capacity=facilities.find(
    f=>f.id===facility
  )?.capacity || 1;

  for(let h=7;h<=20;h++){

    const count=bookings.filter(
      b=>b.booking_date===date &&
      b.start_hour===h
    ).length;

    const slot=document.createElement('div');

    slot.className = 'slot ' +
  (count >= capacity
    ? 'slot-full'
    : count > 0
      ? 'slot-partial'
      : 'slot-free');

    const slotBookings = bookings.filter(
  b => b.booking_date === date &&
       b.start_hour === h
);

const names = slotBookings
  .map(b => b.member_name || 'Unbekannt')
  .join(', ');

slot.textContent =
  String(h).padStart(2, '0') +
  ':00 Uhr – ' + count + '/' + capacity +
  ' Plätze belegt' +
  (names ? ' | ' + names : '');
      
      
      

    slot.onclick = async () => {
  if (count >= capacity) {
    alert('Dieser Zeitraum ist bereits vollständig belegt.');
    return;
  }

  const uhrzeit = String(h).padStart(2, '0') + ':00';

  if (!confirm(
    'Möchtest du die Anlage am ' + date +
    ' um ' + uhrzeit + ' Uhr buchen?'
  )) return;

  const { error } = await db.rpc('book_slot', {
    p_facility: facility,
    p_date: date,
    p_hour: h
  });

if (error) {
  if (error.code === '23505') {
    alert('Du hast diese Anlage für diesen Zeitraum bereits gebucht.');
  } else {
    alert('Buchung nicht möglich: ' + error.message);
  }
  return;
}

  alert('Buchung erfolgreich!');

  await loadBookings();
  await loadMyBookings();
};

    calendar.appendChild(slot);
  }
}

// DATUM

function formatDate(date){

  return date.getFullYear()+'-'+
    String(date.getMonth()+1).padStart(2,'0')+'-'+
    String(date.getDate()).padStart(2,'0');
}

// NAVIGATION

function changeMonth(direction){

  if(view==='week'){
    currentDate.setDate(
      currentDate.getDate()+direction*7
    );
  }else if(view==='day'){
    currentDate.setDate(
      currentDate.getDate()+direction
    );
  }else{
    currentDate.setMonth(
      currentDate.getMonth()+direction
    );
  }

  loadBookings();
}

function goToday(){
  currentDate=new Date();
  loadBookings();
}

function setView(newView){
  view=newView;
  renderCalendar();
}

// BUCHUNG ERSTELLEN

async function makeBooking(){

  if(!member || !member.active || !member.approved){
    return;
  }

  const facility=
    document.getElementById('facility').value;

  const date=
    document.getElementById('bookingDate').value;

  const hour=parseInt(
    document.getElementById('bookingHour').value
  );

  if(!date){
    document.getElementById('bookingMessage')
      .textContent='Bitte Datum auswählen.';
    return;
  }

  const {error}=await db.rpc('book_slot',{
    p_facility:facility,
    p_date:date,
    p_hour:hour
  });

  if(error){
    document.getElementById('bookingMessage')
      .textContent='Buchung nicht möglich: '+error.message;
    return;
  }

  document.getElementById('bookingMessage')
    .textContent='Buchung erfolgreich! ✓';

  currentDate=new Date(date+'T12:00:00');

  await loadBookings();
  await loadMyBookings();
}

// EIGENE BUCHUNGEN

async function loadMyBookings(){

  const {data,error}=await db
    .from('bookings')
    .select('*')
    .eq('member_id',user.id)
    .order('booking_date');

  if(error) return;

  const container=
    document.getElementById('myBookings');

  container.innerHTML='';

  (data||[]).forEach(b=>{

    const facility=facilities.find(
      f=>f.id===b.facility_id
    );

    const row=document.createElement('div');
    row.className='status';

    row.textContent=
      b.booking_date+' – '+
      (facility?.name || b.facility_id)+
      ' – '+String(b.start_hour).padStart(2,'0')+':00 Uhr ';

    const button=document.createElement('button');
    button.className='danger';
    button.textContent='Stornieren';

    button.onclick=()=>cancelBooking(b.id);

    row.appendChild(button);
    container.appendChild(row);
  });
}

// STORNIEREN

async function cancelBooking(id){

  if(!confirm('Buchung wirklich stornieren?')) return;

  const {error}=await db
    .from('bookings')
    .delete()
    .eq('id',id);

  if(error){
    alert(error.message);
    return;
  }

  await loadBookings();
  await loadMyBookings();
}

// MITGLIEDERVERWALTUNG

async function loadMembers(){

  const {data,error}=await db
    .from('members')
    .select('*')
    .order('full_name');

  if(error){
    console.error(error);
    return;
  }

  const list=document.getElementById('membersList');
  list.innerHTML='';

  (data||[]).forEach(m=>{

    const box=document.createElement('div');
    box.className='status';

    const title=document.createElement('strong');
    title.textContent=m.full_name+' – '+m.role;

    box.appendChild(title);

    const info=document.createElement('p');
    info.textContent=
      'Aktiv: '+m.active+
      ' | Freigegeben: '+m.approved;

    box.appendChild(info);

    if(m.role!=='admin'){

      const approve=document.createElement('button');
      approve.textContent='Freischalten';

      approve.onclick=async()=>{
        const {error}=await db.rpc(
          'approve_member',
          {target_member_id:m.id}
        );

        if(error){
          alert(error.message);
        }else{
          loadMembers();
        }
      };

      box.appendChild(approve);

      const toggle=document.createElement('button');
      toggle.className='secondary';
      toggle.textContent=
        m.active?'Deaktivieren':'Aktivieren';

      toggle.onclick=async()=>{
        const {error}=await db.rpc(
          'set_member_active',
          {
           target_member_id:m.id,
new_status:!m.active
          }
        );

        if(error){
          alert(error.message);
        }else{
          loadMembers();
        }
      };

      box.appendChild(toggle);
    }

    list.appendChild(box);
  });
}
// ADMIN – ALLE BUCHUNGEN

async function loadAdminBookings() {
  if (!member || member.role !== 'admin') return;

  const container = document.getElementById('adminBookings');
  if (!container) return;

  container.textContent = 'Buchungen werden geladen ...';

  const { data, error } = await db
    .from('booking_calendar')
    .select('id,facility_name,booking_date,start_hour,member_name')
    .order('booking_date', { ascending: true })
    .order('start_hour', { ascending: true });

  if (error) {
    container.textContent = 'Fehler: ' + error.message;
    return;
  }

  container.innerHTML = '';

  (data || []).forEach(b => {
    const box = document.createElement('div');
    box.className = 'status';

    const info = document.createElement('p');
    info.textContent =
      b.booking_date + ' – ' +
      b.facility_name + ' – ' +
      String(b.start_hour).padStart(2, '0') + ':00 Uhr – ' +
      b.member_name;

    box.appendChild(info);
   const cancelButton = document.createElement('button');
cancelButton.textContent = 'Stornieren';
cancelButton.style.backgroundColor = '#a34b47';

cancelButton.onclick = async () => {
  if (!confirm('Diese Buchung wirklich stornieren?')) return;

  const { error } = await db
    .from('bookings')
    .delete()
    .eq('id', b.id);

  if (error) {
    alert('Stornierung fehlgeschlagen: ' + error.message);
    return;
  }

  await loadAdminBookings();
  await loadBookings();
  await loadMyBookings();
};

box.appendChild(cancelButton); container.appendChild(box);
  });
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

  async(event,session)=>{
    if(event==='SIGNED_IN' && session?.user){
      if(!user){
        await startApp(session.user);
      }
    }
  }
);
